<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Action">
    <sdpi-select setting="direction" default="up">
      <option value="up">Volume up</option>
      <option value="down">Volume down</option>
      <option value="mute">Mute / Unmute</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Step">
    <sdpi-range setting="step" default="2" min="1" max="20" step="1" showvalue></sdpi-range>
  </sdpi-item>
  <sdpi-item label="Speakers">
    <sdpi-checkbox setting="all" label="All speakers"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item label="">
    <sdpi-checkbox-list setting="speakers" datasource="speakers" loading="Looking for Sonos speakers…" hot-reload></sdpi-checkbox-list>
  </sdpi-item>
  <sdpi-item>
    <small>Each press changes every ticked room by the step. The key shows the current volume (~ average when several rooms are ticked). On a Stream Deck + dial: turn for volume, press for mute.</small>
  </sdpi-item>
  <sdpi-item label="Speaker IP">
    <sdpi-textfield setting="host" global placeholder="optional, e.g. 192.168.1.50"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item>
    <small>Only needed when no speakers show up above (multicast discovery blocked): the IP of any one Sonos speaker.</small>
  </sdpi-item>
</body>
</html>
