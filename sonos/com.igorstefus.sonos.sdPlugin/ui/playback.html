<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Command">
    <sdpi-select setting="command" default="toggle">
      <option value="toggle">Play / Pause (toggle)</option>
      <option value="play">Play</option>
      <option value="pause">Pause</option>
      <option value="stop">Stop</option>
      <option value="next">Next track</option>
      <option value="previous">Previous track</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Speakers">
    <sdpi-checkbox setting="all" label="All speakers"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item label="">
    <sdpi-checkbox-list setting="speakers" datasource="speakers" loading="Looking for Sonos speakers…" hot-reload></sdpi-checkbox-list>
  </sdpi-item>
  <sdpi-item>
    <small>Tick the rooms this key controls, or All speakers. Speakers in a group play and pause together: the command goes to the group they are in.</small>
  </sdpi-item>
  <sdpi-item label="Speaker IP">
    <sdpi-textfield setting="host" global placeholder="optional, e.g. 192.168.1.50"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item>
    <small>Only needed when no speakers show up above (multicast discovery blocked): the IP of any one Sonos speaker.</small>
  </sdpi-item>
</body>
</html>
